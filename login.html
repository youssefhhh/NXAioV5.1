<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>NX AIO PRO — Login &amp; Activation</title>
<link rel="icon" href="https://raw.githubusercontent.com/NoMoreLife-1/NXWebsite/refs/heads/main/nn.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ─── Reset & Base ─── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }

:root {
  --c-bg: #030208;
  --c-card: rgba(10, 8, 20, 0.9);
  --c-border: rgba(255, 255, 255, 0.08);
  --c-border-sub: rgba(255, 255, 255, 0.04);
  --cyan: 34, 211, 238;
  --violet: 139, 92, 246;
  --rose: 251, 113, 133;
  --emerald: 52, 211, 153;
  --amber: 251, 191, 36;
  --text: #f1f2f6;
  --text-dim: #9496a8;
  --text-muted: #626478;
  --r-card: 26px;
  --r-md: 14px;
}

body {
  font-family: 'Outfit', system-ui, -apple-system, sans-serif;
  background: radial-gradient(125% 100% at 50% -15%, #130d2a 0%, #080613 45%, #030206 100%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision;
  image-rendering: -webkit-optimize-contrast;
  padding: 16px;
  user-select: none;
}

/* ─── Card Container ─── */
.login-wrap {
  position: relative; z-index: 10;
  width: 100%; max-width: 420px;
  animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(28px) scale(0.96); }
  to { opacity: 1; transform: none; }
}

.login-card {
  position: relative;
  background:
    linear-gradient(165deg, rgba(var(--cyan), .03) 0%, transparent 35%),
    linear-gradient(215deg, rgba(var(--violet), .03) 0%, transparent 35%),
    #0c0a1a;
  border-radius: var(--r-card);
  padding: 34px 28px 32px;
  overflow: visible;
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 0 0 1px rgba(var(--cyan), 0.08) inset,
    0 30px 80px rgba(0, 0, 0, 0.92),
    0 10px 30px rgba(0, 0, 0, 0.7);
}

/* Animated Conic Border */
.card-border-glow {
  position: absolute; inset: 0; border-radius: var(--r-card); padding: 1px;
  background: conic-gradient(from var(--rot, 0deg),
    rgba(var(--cyan), 0.5), rgba(var(--violet), 0.4), rgba(var(--rose), 0.25), rgba(var(--emerald), 0.3), rgba(var(--cyan), 0.5));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: borderRot 7s linear infinite;
  pointer-events: none; z-index: 1;
}
@property --rot { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@keyframes borderRot { to { --rot: 360deg; } }

.top-light-beam {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 65%; height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(var(--cyan), 0.7), rgba(var(--violet), 0.5), transparent);
  pointer-events: none; z-index: 2;
}

/* ─── Brand & Logo ─── */
.brand-center {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 14px; margin-bottom: 28px; position: relative; z-index: 2;
}

.logo-outer {
  position: relative; width: 72px; height: 72px;
}
.logo-spin {
  position: absolute; inset: -3px; border-radius: 20px;
  background: conic-gradient(from 0deg, rgba(var(--cyan), 0.8), rgba(var(--violet), 0.6), rgba(var(--rose), 0.3), rgba(var(--cyan), 0.8));
  animation: logoSpin 3.2s linear infinite; opacity: 0.65;
}
@keyframes logoSpin { to { transform: rotate(360deg); } }
.logo-box {
  position: absolute; inset: 0; z-index: 1; border-radius: 18px;
  background: rgba(12, 10, 24, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.1);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 28px rgba(var(--cyan), 0.2);
}
.logo-box img { width: 46px; height: 46px; object-fit: contain; border-radius: 10px; }

.brand-text { display: flex; flex-direction: column; gap: 4px; }
.brand-name {
  font-size: 1.6rem; font-weight: 900; letter-spacing: -0.05em; line-height: 1;
  background: linear-gradient(135deg, #ffffff 0%, rgba(var(--cyan), 1) 55%, rgba(var(--violet), 1) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.brand-sub {
  font-size: 0.72rem; color: var(--text-dim); font-weight: 500; letter-spacing: 0.02em;
}

.auth-status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 50px;
  background: rgba(52, 211, 153, 0.08); border: 1px solid rgba(52, 211, 153, 0.25);
  font-size: 0.6rem; font-weight: 800; color: rgba(52, 211, 153, 1);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.auth-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(52, 211, 153, 1); box-shadow: 0 0 8px rgba(52, 211, 153, 0.8);
  animation: pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.6); opacity: 0.4; } }

/* ─── Field Input ─── */
.field-wrap {
  position: relative; z-index: 2; margin-bottom: 16px;
}
.field-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
}
.field-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.64rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--text-dim);
}
.field-pip { width: 4px; height: 4px; border-radius: 50%; background: rgba(var(--cyan), 1); }
.field-badge { font-size: 0.58rem; color: rgba(var(--cyan), 0.8); font-weight: 700; text-transform: uppercase; }

.input-container {
  position: relative; display: flex; align-items: center;
}
.input-field {
  width: 100%;
  background: rgba(0, 0, 0, 0.45);
  border: 1.5px solid rgba(255, 255, 255, 0.09);
  border-radius: var(--r-md);
  padding: 15px 44px 15px 44px;
  color: #ffffff;
  font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; font-weight: 600;
  outline: none; transition: all 0.3s ease;
  letter-spacing: 0.04em;
}
.input-field::placeholder { color: rgba(255, 255, 255, 0.18); font-family: 'Inter', sans-serif; font-size: 0.8rem; }
.input-field:focus {
  border-color: rgba(var(--cyan), 0.6);
  background: rgba(0, 0, 0, 0.6);
  box-shadow: 0 0 0 3px rgba(var(--cyan), 0.12), 0 0 25px rgba(var(--cyan), 0.1);
}

.input-icon-left {
  position: absolute; left: 15px; width: 18px; height: 18px;
  color: rgba(255, 255, 255, 0.3); pointer-events: none; transition: color 0.3s;
}
.input-field:focus ~ .input-icon-left { color: rgba(var(--cyan), 1); }

.input-icon-paste {
  position: absolute; right: 12px; width: 26px; height: 26px;
  border-radius: 7px; background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.4); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s ease;
}
.input-icon-paste:hover {
  background: rgba(var(--cyan), 0.15); border-color: rgba(var(--cyan), 0.4);
  color: rgba(var(--cyan), 1);
}
.input-icon-paste svg { width: 13px; height: 13px; }

/* Remember Key Checkbox */
.remember-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px; position: relative; z-index: 2;
}
.remember-label {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.68rem; color: var(--text-dim); cursor: pointer; font-weight: 500;
}
.remember-check {
  accent-color: rgba(var(--cyan), 1); width: 14px; height: 14px; cursor: pointer;
}
.remember-link {
  font-size: 0.64rem; color: rgba(var(--cyan), 0.8); text-decoration: none; font-weight: 600;
  transition: color 0.2s; cursor: pointer;
}
.remember-link:hover { color: rgba(var(--cyan), 1); text-decoration: underline; }

/* ─── Activate Button ─── */
.btn-activate {
  position: relative; overflow: hidden;
  width: 100%; margin-top: 22px; padding: 16px 20px;
  border-radius: var(--r-md);
  border: 1.5px solid rgba(var(--cyan), 0.38);
  background: linear-gradient(135deg, rgba(var(--cyan), 0.14) 0%, rgba(var(--violet), 0.1) 100%);
  font-family: inherit; font-size: 0.84rem; font-weight: 900;
  letter-spacing: 0.09em; text-transform: uppercase;
  color: #ffffff; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 8px 30px rgba(var(--cyan), 0.18), 0 0 0 1px rgba(var(--cyan), 0.1) inset;
  transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  outline: none; -webkit-appearance: none; z-index: 2;
}
.btn-activate::after {
  content: ''; position: absolute; top: 0; left: -90%; width: 55%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
  animation: runSweep 3.5s ease-in-out infinite;
}
@keyframes runSweep { 0%, 20% { left: -90%; } 80%, 100% { left: 160%; } }
.btn-activate:hover {
  border-color: rgba(var(--cyan), 0.8);
  box-shadow: 0 10px 40px rgba(var(--cyan), 0.35), 0 0 0 1px rgba(var(--cyan), 0.25) inset;
  transform: translateY(-2px);
}
.btn-activate:active { transform: translateY(0) scale(0.98); }
.activate-circle {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(var(--cyan), 0.25); border: 1px solid rgba(var(--cyan), 0.4);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.activate-circle svg { width: 12px; height: 12px; fill: #ffffff; margin-left: 2px; }

/* ─── Footer & Social Links ─── */
.footer-section {
  position: relative; z-index: 2;
  margin-top: 24px; padding-top: 18px;
  border-top: 1px solid var(--c-border-sub);
  display: flex; align-items: center; justify-content: space-between;
}
.security-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.58rem; color: rgba(255, 255, 255, 0.25);
  font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
}
.security-badge svg { width: 12px; height: 12px; opacity: 0.4; }

.social-links { display: flex; gap: 8px; }
.social-btn {
  padding: 5px 10px; border-radius: 8px;
  background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.07);
  color: var(--text-dim); text-decoration: none; font-size: 0.6rem; font-weight: 700;
  display: flex; align-items: center; gap: 5px; transition: all 0.2s ease;
}
.social-btn:hover {
  background: rgba(var(--cyan), 0.1); border-color: rgba(var(--cyan), 0.35);
  color: rgba(var(--cyan), 1);
}

/* ─── Toast System ─── */
#nx-toasts {
  position: fixed; top: 18px; right: 18px;
  display: flex; flex-direction: column; gap: 10px;
  z-index: 99999; pointer-events: none; width: 330px;
}
.nx-toast {
  pointer-events: auto; position: relative; overflow: hidden;
  display: flex; align-items: stretch;
  background: rgba(10, 8, 22, 0.96);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
  transform: translateX(calc(100% + 25px)); opacity: 0;
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
}
.nx-toast.show { transform: translateX(0); opacity: 1; }
.nx-toast.hide { transform: translateX(calc(100% + 25px)); opacity: 0; }

.nt-bar { width: 4px; flex-shrink: 0; }
.nx-toast.t-success .nt-bar { background: rgba(var(--emerald), 1); box-shadow: 0 0 14px rgba(var(--emerald), 0.7); }
.nx-toast.t-error .nt-bar { background: rgba(var(--rose), 1); box-shadow: 0 0 14px rgba(var(--rose), 0.7); }
.nx-toast.t-info .nt-bar { background: rgba(var(--cyan), 1); box-shadow: 0 0 14px rgba(var(--cyan), 0.7); }

.nt-icon-wrap { padding: 14px 10px 14px 12px; display: flex; align-items: center; }
.nt-icon {
  width: 32px; height: 32px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.nx-toast.t-success .nt-icon { background: rgba(var(--emerald), 0.14); color: rgba(var(--emerald), 1); }
.nx-toast.t-error .nt-icon { background: rgba(var(--rose), 0.14); color: rgba(var(--rose), 1); }
.nx-toast.t-info .nt-icon { background: rgba(var(--cyan), 0.14); color: rgba(var(--cyan), 1); }
.nt-icon svg { width: 17px; height: 17px; }

.nt-body { flex: 1; min-width: 0; padding: 14px 14px 14px 0; display: flex; flex-direction: column; justify-content: center; }
.nt-title { font-size: 0.78rem; font-weight: 800; color: var(--text); line-height: 1.2; margin-bottom: 2px; }
.nt-msg { font-size: 0.68rem; color: var(--text-dim); font-weight: 500; line-height: 1.4; word-break: break-word; }

.nt-close {
  position: absolute; top: 8px; right: 8px;
  width: 20px; height: 20px; border-radius: 6px;
  background: transparent; border: none; cursor: pointer;
  color: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center;
}
.nt-close:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
.nt-close svg { width: 12px; height: 12px; }

</style>

<div id="nx-toasts"></div>

<script>
(function(){
  /* ── Background Particles ── */
  var pw = document.getElementById('pts');
  if (pw) {
    var cols = ['34,211,238', '139,92,246', '251,113,133', '52,211,153'];
    for (var i = 0; i < 20; i++) {
      var el = document.createElement('div'); el.className = 'pt';
      var sz = (1.2 + Math.random() * 2.6).toFixed(1);
      var c = cols[i % cols.length];
      el.style.cssText =
        'left:' + (Math.random() * 100) + '%;' +
        'width:' + sz + 'px;height:' + sz + 'px;' +
        'background:rgba(' + c + ',0.4);' +
        'animation-duration:' + (10 + Math.random() * 16) + 's;' +
        'animation-delay:' + (Math.random() * 12) + 's;';
      pw.appendChild(el);
    }
  }

  /* ══════════════════════════════════════════
     NX TOAST ENGINE
     ══════════════════════════════════════════ */
  var ICONS = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>',
    error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
  };
  var TITLES = { success: 'License Verified', error: 'Authentication Failed', info: 'Authentication' };

  function nxToast(msg, type, dur) {
    type = type || 'info'; dur = dur || 4000;
    var stack = document.getElementById('nx-toasts');
    if (!stack) return;
    var t = document.createElement('div');
    t.className = 'nx-toast t-' + type;
    t.innerHTML =
      '<div class="nt-bar"></div>' +
      '<div class="nt-icon-wrap"><div class="nt-icon">' + (ICONS[type] || ICONS.info) + '</div></div>' +
      '<div class="nt-body">' +
        '<div class="nt-title">' + (TITLES[type] || 'Notification') + '</div>' +
        '<div class="nt-msg">' + msg + '</div>' +
      '</div>' +
      '<button class="nt-close" aria-label="Close">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
      '</button>';
    stack.appendChild(t);

    function dismiss() {
      t.classList.add('hide'); t.classList.remove('show');
      setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 450);
    }
    t.querySelector('.nt-close').addEventListener('click', dismiss);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ t.classList.add('show'); }); });
    var tid = setTimeout(dismiss, dur);
    t.addEventListener('mouseenter', function(){ clearTimeout(tid); });
    t.addEventListener('mouseleave', function(){ tid = setTimeout(dismiss, 1000); });
  }

  window.nxToast = nxToast;
  window.showLoginError = function(m){ nxToast(m || 'Invalid license key.', 'error'); };
  window.showLoginSuccess = function(m){ nxToast(m || 'Login successful!', 'success'); };

  /* ── Paste Button Helper ── */
  var btnPaste = document.getElementById('btnPasteKey');
  var inp = document.getElementById('licenseKey');
  if (btnPaste && inp) {
    btnPaste.addEventListener('click', function() {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function(text) {
          if (text) {
            inp.value = text.trim();
            nxToast('Pasted license key from clipboard!', 'info', 2000);
          }
        }).catch(function() {
          inp.focus();
        });
      } else {
        inp.focus();
      }
    });
  }

  /* ── Saved License Key Loading ── */
  try {
    var saved = localStorage.getItem('nxaio_saved_license');
    if (saved && inp) {
      inp.value = saved;
    }
  } catch(e){}

  /* ── Login Dispatcher ── */
  var btn = document.getElementById('loginBtn');
  var chkRemember = document.getElementById('chkRemember');

  btn.addEventListener('click', function(e) {
    var key = inp.value.trim();
    if (!key) {
      nxToast('Please enter your license key to continue.', 'error');
      inp.focus();
      return;
    }

    if (chkRemember && chkRemember.checked) {
      try { localStorage.setItem('nxaio_saved_license', key); } catch(e){}
    } else {
      try { localStorage.removeItem('nxaio_saved_license'); } catch(e){}
    }

    nxToast('Authenticating with server...', 'info', 3000);

    var hasWebview = !!(window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function');
    if (hasWebview) {
      window.chrome.webview.postMessage('LOGIN|' + key);
    } else {
      nxToast('Authentication failed: Secure WebView2 runtime environment required!', 'error');
    }
  });

  inp.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') btn.click();
  });
})();
</script>
