<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>NX NX AIM TOOL — Login</title>
<link rel="icon" href="https://raw.githubusercontent.com/youssefhhh/NXWebsite/refs/heads/main/nn.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" rel="stylesheet">
<style>
/* ─── Reset ─── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{height:100%}

/* ─── Tokens ─── */
:root{
  --c-bg:#04030a;
  --c-s0:rgba(8,6,18,.82);
  --c-border:rgba(255,255,255,.07);
  --c-border2:rgba(255,255,255,.04);
  --cyan:34,211,238;
  --violet:139,92,246;
  --rose:251,113,133;
  --emerald:52,211,153;
  --amber:251,191,36;
  --text:#ececf1;
  --muted:#8888a4;
  --r:22px;
  --r-sm:14px;
}

body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--c-bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  padding:16px;
}

/* ─── Aurora BG ─── */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden}
.aurora-layer{
  position:absolute;border-radius:50%;
  filter:blur(100px);opacity:0;
  animation:auroraMove var(--dur,20s) ease-in-out infinite var(--del,0s),auroraIn 2s ease forwards var(--del,0s);
}
.al1{--dur:24s;--del:0s;width:600px;height:600px;top:-20%;left:-10%;
  background:radial-gradient(circle,rgba(var(--cyan),.13) 0%,transparent 65%)}
.al2{--dur:28s;--del:-7s;width:500px;height:500px;top:30%;right:-15%;
  background:radial-gradient(circle,rgba(var(--violet),.11) 0%,transparent 65%)}
.al3{--dur:22s;--del:-14s;width:400px;height:400px;bottom:-15%;left:20%;
  background:radial-gradient(circle,rgba(var(--rose),.07) 0%,transparent 65%)}
@keyframes auroraMove{
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(50px,-35px) scale(1.07)}
  50%{transform:translate(-30px,25px) scale(.93)}
  75%{transform:translate(35px,45px) scale(1.04)}
}
@keyframes auroraIn{to{opacity:1}}

/* Grid */
.grid-bg{
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,.01) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse 60% 55% at 50% 50%,black 10%,transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 50%,black 10%,transparent 72%);
}

/* Scan lines */
.scan{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.05) 3px,rgba(0,0,0,.05) 4px)}

/* Particles */
.pts{position:fixed;inset:0;z-index:0;pointer-events:none}
.pt{position:absolute;border-radius:50%;animation:ptUp linear infinite}
@keyframes ptUp{
  0%{transform:translateY(110vh) scale(0);opacity:0}
  6%{opacity:1}
  94%{opacity:.7}
  100%{transform:translateY(-5vh) scale(1.3);opacity:0}
}

/* ─── Card wrapper ─── */
.wrap{
  position:relative;z-index:10;
  width:100%;max-width:380px;
  animation:wrapIn .8s cubic-bezier(.16,1,.3,1) both;
}
@keyframes wrapIn{
  from{opacity:0;transform:translateY(32px) scale(.96)}
  to{opacity:1;transform:none}
}

/* ─── Glass card ─── */
.card{
  position:relative;
  background:var(--c-s0);
  backdrop-filter:blur(56px) saturate(1.5);
  -webkit-backdrop-filter:blur(56px) saturate(1.5);
  border-radius:var(--r);
  padding:36px 30px 40px;
  overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.05) inset,
    0 40px 90px rgba(0,0,0,.65),
    0 0 0 1px rgba(var(--cyan),.05) inset;
}

/* Animated gradient border */
.card-border{
  position:absolute;inset:0;border-radius:var(--r);
  padding:1px;
  background:conic-gradient(from var(--a,0deg),
    rgba(var(--cyan),.5),rgba(var(--violet),.4),rgba(var(--rose),.2),
    rgba(var(--violet),.4),rgba(var(--cyan),.5));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:borderSpin 6s linear infinite;
  pointer-events:none;z-index:1;
}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes borderSpin{to{--a:360deg}}

/* Top glow line */
.card-line{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:65%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--cyan),.5),rgba(var(--violet),.35),transparent);
  pointer-events:none;z-index:2;
}

/* Inner ambient glow */
.card-glow{
  position:absolute;top:-40%;left:50%;transform:translateX(-50%);
  width:110%;height:180%;
  background:radial-gradient(ellipse 45% 25% at 50% 20%,rgba(var(--cyan),.08),transparent);
  pointer-events:none;z-index:0;
}

/* ─── Brand ─── */
.brand{
  display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:16px;margin-bottom:34px;
  position:relative;z-index:2;
}

/* Logo with spinning conic ring */
.logo-outer{
  position:relative;width:80px;height:80px;
}
.logo-spin{
  position:absolute;inset:-3px;border-radius:22px;
  background:conic-gradient(from 0deg,rgba(var(--cyan),.8),rgba(var(--violet),.6),rgba(var(--rose),.3),rgba(var(--violet),.6),rgba(var(--cyan),.8));
  animation:logoSpin 3s linear infinite;
  opacity:.55;
}
@keyframes logoSpin{to{transform:rotate(360deg)}}
.logo-mask{
  position:absolute;inset:-2px;border-radius:21px;background:var(--c-bg);
}
.logo-box{
  position:absolute;inset:0;z-index:1;
  border-radius:18px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.09);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 28px rgba(var(--cyan),.15),0 10px 30px rgba(0,0,0,.4);
  animation:logoGlow 4s ease-in-out infinite;
}
@keyframes logoGlow{
  0%,100%{box-shadow:0 0 22px rgba(var(--cyan),.12),0 10px 30px rgba(0,0,0,.4)}
  50%{box-shadow:0 0 42px rgba(var(--cyan),.26),0 10px 30px rgba(0,0,0,.4)}
}
.logo-box img{width:52px;height:52px;object-fit:contain;border-radius:12px;display:block}

.brand-name{
  font-size:1.75rem;font-weight:900;letter-spacing:-.06em;line-height:1;
  background:linear-gradient(135deg,#fff 0%,rgba(var(--cyan),1) 55%,rgba(var(--violet),1) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.brand-desc{font-size:.72rem;color:var(--muted);font-weight:500;letter-spacing:.01em;margin-top:2px}

/* Online pill */
.online-pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 14px;border-radius:50px;
  background:rgba(var(--emerald),.07);
  border:1px solid rgba(var(--emerald),.22);
  font-size:.63rem;font-weight:700;color:rgba(var(--emerald),1);
  letter-spacing:.09em;text-transform:uppercase;
}
.online-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(var(--emerald),1);
  box-shadow:0 0 8px rgba(var(--emerald),.7);
  animation:blip 2.2s ease-in-out infinite;
}
@keyframes blip{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.65)}}

/* ─── Field ─── */
.field{position:relative;z-index:2;margin-bottom:16px}
.flabel{
  display:flex;align-items:center;gap:7px;
  font-size:.62rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.14em;color:var(--muted);margin-bottom:9px;
}
.flabel-pip{width:4px;height:4px;border-radius:50%;background:rgba(var(--cyan),1);opacity:.65}

.finput{position:relative}
.finput input{
  width:100%;
  background:rgba(0,0,0,.38);
  border:1.5px solid rgba(255,255,255,.07);
  border-radius:var(--r-sm);
  padding:16px 16px 16px 50px;
  color:var(--text);
  font-size:.88rem;font-family:inherit;font-weight:500;
  outline:none;
  transition:border-color .3s,box-shadow .3s,background .3s;
  letter-spacing:.03em;
}
.finput input::placeholder{color:rgba(255,255,255,.15)}
.finput input:focus{
  border-color:rgba(var(--cyan),.55);
  box-shadow:0 0 0 3px rgba(var(--cyan),.09),0 0 22px rgba(var(--cyan),.07);
  background:rgba(0,0,0,.48);
}
.finput input:focus~.ficon{color:rgba(var(--cyan),1)}
.ficon{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:19px;height:19px;color:rgba(255,255,255,.22);
  pointer-events:none;transition:color .3s;
}

/* ─── Login Button ─── */
.btn-login{
  position:relative;overflow:hidden;
  width:100%;margin-top:22px;
  padding:16px 24px;
  border-radius:var(--r-sm);
  border:1.5px solid rgba(var(--cyan),.32);
  background:rgba(var(--cyan),.07);
  font-family:inherit;font-size:.83rem;font-weight:900;
  letter-spacing:.1em;text-transform:uppercase;
  color:rgba(var(--cyan),1);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:12px;
  transition:all .3s ease;z-index:2;
}
/* Hover gradient fill */
.btn-login::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(var(--cyan),.14) 0%,rgba(var(--violet),.08) 100%);
  opacity:0;transition:opacity .3s;
}
.btn-login:hover::before{opacity:1}
/* Shimmer sweep */
.btn-login::after{
  content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
  animation:shimmer 3.5s ease-in-out infinite;
}
@keyframes shimmer{0%,25%{left:-80%}75%,100%{left:140%}}
.btn-login:hover{
  border-color:rgba(var(--cyan),.6);
  box-shadow:0 0 36px rgba(var(--cyan),.18),0 0 0 1px rgba(var(--cyan),.14) inset;
  transform:translateY(-2px);
}
.btn-login:active{transform:translateY(0) scale(.98)}

.btn-play{
  width:30px;height:30px;border-radius:50%;
  background:rgba(var(--cyan),.15);
  border:1px solid rgba(var(--cyan),.22);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .3s,box-shadow .3s;
}
.btn-login:hover .btn-play{
  background:rgba(var(--cyan),.26);
  box-shadow:0 0 14px rgba(var(--cyan),.25);
}
.btn-play svg{width:11px;height:11px;fill:rgba(var(--cyan),1);margin-left:2px}

/* ─── Card footer ─── */
.cfoot{
  position:relative;z-index:2;
  margin-top:26px;padding-top:22px;
  border-top:1px solid var(--c-border2);
  display:flex;align-items:center;justify-content:space-between;
}
.cfoot-lock{
  display:flex;align-items:center;gap:7px;
  font-size:.6rem;color:rgba(255,255,255,.2);
  font-weight:600;letter-spacing:.07em;text-transform:uppercase;
}
.cfoot-lock svg{width:13px;height:13px;opacity:.35}
.cfoot-ver{font-size:.58rem;color:rgba(255,255,255,.15);font-weight:600;letter-spacing:.08em}

/* ─── Stagger ─── */
.s1{animation:su .6s ease both .08s}
.s2{animation:su .6s ease both .16s}
.s3{animation:su .6s ease both .24s}
.s4{animation:su .6s ease both .32s}
.s5{animation:su .6s ease both .40s}
@keyframes su{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ════════════════════════════════════════
   TOAST NOTIFICATION SYSTEM
   ════════════════════════════════════════ */
#nx-toasts{
  position:fixed;top:22px;right:22px;
  display:flex;flex-direction:column;gap:12px;
  z-index:9999;pointer-events:none;
  width:320px;
}

.nx-toast{
  pointer-events:auto;
  position:relative;overflow:hidden;
  display:flex;align-items:flex-start;gap:0;
  background:rgba(8,6,18,.97);
  border:1px solid rgba(255,255,255,.07);
  border-radius:18px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.04) inset,
    0 24px 60px rgba(0,0,0,.6),
    0 4px 20px rgba(0,0,0,.3);
  transform:translateX(calc(100% + 30px));
  opacity:0;
  transition:
    transform .5s cubic-bezier(.34,1.56,.64,1),
    opacity   .35s ease;
}
.nx-toast.show{transform:translateX(0);opacity:1}
.nx-toast.hide{
  transform:translateX(calc(100% + 30px));
  opacity:0;
  transition:transform .38s cubic-bezier(.55,.06,.68,.19),opacity .28s ease;
}

/* Left accent */
.nt-accent{
  width:4px;min-height:100%;
  flex-shrink:0;border-radius:18px 0 0 18px;
}
.nx-toast.t-success .nt-accent{background:linear-gradient(180deg,rgba(var(--emerald),1),rgba(52,211,153,.5));box-shadow:0 0 14px rgba(var(--emerald),.5)}
.nx-toast.t-error   .nt-accent{background:linear-gradient(180deg,rgba(var(--rose),1),rgba(251,113,133,.5));box-shadow:0 0 14px rgba(var(--rose),.5)}
.nx-toast.t-info    .nt-accent{background:linear-gradient(180deg,rgba(var(--cyan),1),rgba(34,211,238,.5));box-shadow:0 0 14px rgba(var(--cyan),.5)}
.nx-toast.t-warning .nt-accent{background:linear-gradient(180deg,rgba(var(--amber),1),rgba(251,191,36,.5));box-shadow:0 0 14px rgba(var(--amber),.5)}

/* Icon block */
.nt-icon-wrap{
  padding:14px 10px 14px 14px;flex-shrink:0;
}
.nt-icon{
  width:36px;height:36px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
}
.nx-toast.t-success .nt-icon{background:rgba(var(--emerald),.12);color:rgba(var(--emerald),1)}
.nx-toast.t-error   .nt-icon{background:rgba(var(--rose),.12);color:rgba(var(--rose),1)}
.nx-toast.t-info    .nt-icon{background:rgba(var(--cyan),.12);color:rgba(var(--cyan),1)}
.nx-toast.t-warning .nt-icon{background:rgba(var(--amber),.12);color:rgba(var(--amber),1)}
.nt-icon svg{width:18px;height:18px;stroke-width:2.2}

/* Text */
.nt-body{flex:1;min-width:0;padding:14px 16px 14px 0}
.nt-title{font-size:.8rem;font-weight:800;color:var(--text);line-height:1.2;margin-bottom:4px}
.nt-msg{font-size:.71rem;color:var(--muted);font-weight:500;line-height:1.45}

/* Close btn */
.nt-close{
  position:absolute;top:10px;right:10px;
  width:22px;height:22px;border-radius:6px;
  background:transparent;border:none;cursor:pointer;
  color:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,color .2s;
}
.nt-close:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)}
.nt-close svg{width:12px;height:12px;stroke-width:2.5}

/* Progress bar */
.nt-progress{
  position:absolute;bottom:0;left:4px;right:0;height:2.5px;
  border-radius:0 0 18px 18px;
  transform-origin:left;
  animation:ntProg var(--d,4s) linear forwards;
}
.nx-toast.t-success .nt-progress{background:linear-gradient(90deg,rgba(var(--emerald),1),rgba(var(--emerald),.4))}
.nx-toast.t-error   .nt-progress{background:linear-gradient(90deg,rgba(var(--rose),1),rgba(var(--rose),.4))}
.nx-toast.t-info    .nt-progress{background:linear-gradient(90deg,rgba(var(--cyan),1),rgba(var(--cyan),.4))}
.nx-toast.t-warning .nt-progress{background:linear-gradient(90deg,rgba(var(--amber),1),rgba(var(--amber),.4))}
@keyframes ntProg{from{transform:scaleX(1)}to{transform:scaleX(0)}}
</style>
</head>
<body>

<!-- Background layers -->
<div class="aurora">
  <div class="aurora-layer al1"></div>
  <div class="aurora-layer al2"></div>
  <div class="aurora-layer al3"></div>
</div>
<div class="grid-bg"></div>
<div class="scan"></div>
<div class="pts" id="pts"></div>

<!-- Card -->
<div class="wrap">
  <div class="card">
    <div class="card-border"></div>
    <div class="card-line"></div>
    <div class="card-glow"></div>

    <!-- Brand -->
    <div class="brand s1">
      <div class="logo-outer">
        <div class="logo-spin"></div>
        <div class="logo-mask"></div>
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/youssefhhh/NXWebsite/refs/heads/main/nn.ico"
               width="52" height="52" alt="NX AIO" decoding="async" fetchpriority="high">
        </div>
      </div>
      <div>
        <div class="brand-name">NX AIO</div>
        <div class="brand-desc">Next-Level PUBG Optimizer</div>
      </div>
      <div class="online-pill">
        <div class="online-dot"></div>
        All Systems Online
      </div>
    </div>

    <!-- License field -->
    <div class="field s2">
      <div class="flabel">
        <div class="flabel-pip"></div>
        License Key
      </div>
      <div class="finput">
        <input type="text" id="licenseKey"
               placeholder="XXXX-XXXX-XXXX-XXXX"
               autocomplete="off" spellcheck="false" autocapitalize="off">
        <svg class="ficon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
    </div>

    <!-- Submit -->
    <button class="btn-login s3" id="loginBtn" type="button">
      <div class="btn-play">
        <svg viewBox="0 0 24 24"><path d="M8 5V19L19 12L8 5Z"/></svg>
      </div>
      Activate License
    </button>

    <!-- Footer -->
    <div class="cfoot s4">
      <div class="cfoot-lock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        End-to-End Encrypted
      </div>
      <div class="cfoot-ver">v3.0.0</div>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="nx-toasts"></div>

<script>
(function(){
  /* ── Particles ── */
  var w=document.getElementById('pts');
  var cols=['34,211,238','139,92,246','251,113,133','52,211,153'];
  for(var i=0;i<22;i++){
    var el=document.createElement('div');
    el.className='pt';
    var sz=(1+Math.random()*2.8).toFixed(1);
    var c=cols[i%cols.length];
    el.style.cssText=
      'left:'+(Math.random()*100)+'%;'+
      'width:'+sz+'px;height:'+sz+'px;'+
      'background:rgba('+c+',.38);'+
      'animation-duration:'+(11+Math.random()*18)+'s;'+
      'animation-delay:'+(Math.random()*14)+'s;';
    w.appendChild(el);
  }

  /* ══════════════════════════════
     NX TOAST ENGINE
     ══════════════════════════════ */
  var TOAST_ICONS={
    success:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>',
    error:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    info:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    warning:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
  };
  var TOAST_TITLES={success:'Success',error:'Error',info:'Info',warning:'Warning'};

  window.nxToast=function(msg,type,dur){
    type=type||'info';dur=dur||4000;
    var stack=document.getElementById('nx-toasts');
    var t=document.createElement('div');
    t.className='nx-toast t-'+type;
    t.style.setProperty('--d',(dur/1000)+'s');
    t.innerHTML=
      '<div class="nt-accent"></div>'+
      '<div class="nt-icon-wrap"><div class="nt-icon">'+TOAST_ICONS[type]+'</div></div>'+
      '<div class="nt-body">'+
        '<div class="nt-title">'+TOAST_TITLES[type]+'</div>'+
        '<div class="nt-msg">'+msg+'</div>'+
      '</div>'+
      '<button class="nt-close" aria-label="Dismiss">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'+
      '</button>'+
      '<div class="nt-progress"></div>';
    stack.appendChild(t);

    /* Dismiss helper */
    function dismiss(){
      t.classList.add('hide');t.classList.remove('show');
      setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},420);
    }
    t.querySelector('.nt-close').addEventListener('click',dismiss);

    /* Trigger show */
    requestAnimationFrame(function(){requestAnimationFrame(function(){t.classList.add('show')})});
    var tid=setTimeout(dismiss,dur);
    t.addEventListener('mouseenter',function(){clearTimeout(tid)});
    t.addEventListener('mouseleave',function(){tid=setTimeout(dismiss,800)});
  };

  /* ── Public shorthands ── */
  window.showLoginError  =function(m){nxToast(m||'Invalid license key.','error')};
  window.showLoginSuccess=function(m){nxToast(m||'Login successful!','success')};

  /* ── Login logic ── */
  var btn=document.getElementById('loginBtn');
  var inp=document.getElementById('licenseKey');

  btn.addEventListener('click',function(e){
    /* Ripple */
    var r=this.getBoundingClientRect();
    var rip=document.createElement('span');
    rip.style.cssText=
      'position:absolute;border-radius:50%;pointer-events:none;z-index:0;width:0;height:0;'+
      'background:rgba(34,211,238,.15);transform:translate(-50%,-50%);'+
      'left:'+(e.clientX-r.left)+'px;top:'+(e.clientY-r.top)+'px;'+
      'animation:rip .6s ease-out forwards';
    if(!document.getElementById('rcss')){
      var s=document.createElement('style');s.id='rcss';
      s.textContent='@keyframes rip{0%{width:0;height:0;opacity:1}100%{width:440px;height:440px;opacity:0}}';
      document.head.appendChild(s);
    }
    btn.appendChild(rip);
    setTimeout(function(){if(rip.parentNode)rip.parentNode.removeChild(rip)},650);

    var key=inp.value.trim();
    if(!key){nxToast('Please enter your license key to continue.','error');return}

    if(window.chrome&&window.chrome.webview){
      window.chrome.webview.postMessage('LOGIN|'+key);
    }else{
      window.location.href='index.html';
    }
  });

  inp.addEventListener('keypress',function(e){if(e.key==='Enter')btn.click()});
})();
</script>
</body>
</html>
