<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>NX AIO — Login</title>
    <link rel="icon" href="https://raw.githubusercontent.com/youssefhhh/NXWebsite/refs/heads/main/nn.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07060b;
            --surface: rgba(16, 14, 22, 0.8);
            --surface-border: rgba(255, 255, 255, 0.07);
            --primary: #22d3ee;
            --primary-rgb: 34, 211, 238;
            --accent: #a78bfa;
            --accent-rgb: 167, 139, 250;
            --danger: #fb7185;
            --danger-rgb: 251, 113, 133;
            --success: #34d399;
            --success-rgb: 52, 211, 153;
            --text: #f0f0f3;
            --muted: #8b8b9e;
            --radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: var(--text);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-canvas { position: fixed; inset: 0; z-index: 0; overflow: hidden; }

        .orb {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0;
            animation: orbFloat 18s ease-in-out infinite, orbFadeIn 1.5s ease forwards;
        }
        .orb-1 {
            width: 360px; height: 360px;
            background: radial-gradient(circle, rgba(var(--primary-rgb), 0.18), transparent 70%);
            top: -15%; left: 25%;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(var(--accent-rgb), 0.14), transparent 70%);
            bottom: -10%; right: -5%; animation-delay: -6s;
        }
        .orb-3 {
            width: 240px; height: 240px;
            background: radial-gradient(circle, rgba(var(--danger-rgb), 0.09), transparent 70%);
            top: 60%; left: -8%; animation-delay: -12s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -20px) scale(1.04); }
            50% { transform: translate(-15px, 15px) scale(0.96); }
            75% { transform: translate(20px, 30px) scale(1.02); }
        }
        @keyframes orbFadeIn { to { opacity: 1; } }

        .grid-overlay {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(ellipse 55% 45% at 50% 50%, black 20%, transparent 72%);
            -webkit-mask-image: radial-gradient(ellipse 55% 45% at 50% 50%, black 20%, transparent 72%);
        }

        .noise {
            pointer-events: none; position: fixed; inset: 0; opacity: 0.025; z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .particle {
            position: absolute; width: 2px; height: 2px;
            background: rgba(var(--primary-rgb), 0.3); border-radius: 50%;
            animation: particleFloat linear infinite;
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .wrap {
            width: 100%; max-width: 360px; position: relative; z-index: 1;
            animation: cardEntry 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; transform: translateY(24px) scale(0.97);
        }
        @keyframes cardEntry { to { opacity: 1; transform: translateY(0) scale(1); } }

        .card {
            position: relative;
            background: var(--surface);
            backdrop-filter: blur(40px) saturate(1.3);
            -webkit-backdrop-filter: blur(40px) saturate(1.3);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius);
            padding: 28px 24px 32px;
            overflow: hidden;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 24px 70px rgba(0,0,0,0.5);
        }

        .card::before {
            content: ''; position: absolute; inset: -1px;
            border-radius: var(--radius); padding: 1px;
            background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.25), transparent 40%, transparent 60%, rgba(var(--accent-rgb), 0.15));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none; z-index: 1;
        }

        .card-glow {
            position: absolute; top: -60%; left: 50%; transform: translateX(-50%);
            width: 200%; height: 200%;
            background: radial-gradient(ellipse 35% 20% at 50% 20%, rgba(var(--primary-rgb), 0.06), transparent);
            pointer-events: none; z-index: 0;
        }

        .brand {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; gap: 12px;
            margin-bottom: 28px; position: relative; z-index: 2;
        }

        .logo {
            width: 56px; height: 56px; border-radius: 16px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            padding: 5px; animation: logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 18px rgba(var(--primary-rgb), 0.1), 0 6px 22px rgba(0,0,0,0.3); }
            50% { box-shadow: 0 0 32px rgba(var(--primary-rgb), 0.2), 0 6px 22px rgba(0,0,0,0.3); }
        }

        .logo img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 11px; }

        .brand-text h1 {
            font-size: 1.4rem; font-weight: 900; letter-spacing: -0.04em; line-height: 1.1;
            background: linear-gradient(135deg, #fff 0%, rgba(var(--primary-rgb), 0.85) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .brand-text p {
            font-size: 0.72rem; color: var(--muted); margin-top: 2px; font-weight: 500;
        }

        .field-label {
            font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.14em; color: var(--muted);
            margin-bottom: 8px; display: block; position: relative; z-index: 2;
        }

        .input-wrap {
            position: relative; margin-bottom: 18px; z-index: 2;
        }

        .input-wrap input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1.5px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            padding: 14px 14px 14px 44px;
            color: var(--text);
            font-size: 0.88rem;
            font-family: inherit;
            font-weight: 500;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }

        .input-wrap input::placeholder { color: rgba(255,255,255,0.18); }

        .input-wrap input:focus {
            border-color: rgba(var(--primary-rgb), 0.45);
            box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.08), 0 0 16px rgba(var(--primary-rgb), 0.06);
            background: rgba(0,0,0,0.4);
        }

        .input-wrap .ico {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            width: 18px; height: 18px; color: var(--muted);
            pointer-events: none; transition: color 0.3s;
        }
        .input-wrap input:focus ~ .ico { color: var(--primary); }

        .btn-primary {
            width: 100%;
            border: 1.5px solid rgba(var(--primary-rgb), 0.25);
            border-radius: 14px;
            padding: 14px 20px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--primary);
            background: rgba(var(--primary-rgb), 0.06);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            border-color: rgba(var(--primary-rgb), 0.5);
            background: rgba(var(--primary-rgb), 0.1);
            box-shadow: 0 0 24px rgba(var(--primary-rgb), 0.12), 0 0 0 1px rgba(var(--primary-rgb), 0.1) inset;
            transform: translateY(-2px);
        }

        .btn-primary:active { transform: translateY(0) scale(0.98); }

        .btn-primary .btn-play {
            width: 26px; height: 26px; border-radius: 50%;
            background: rgba(var(--primary-rgb), 0.12);
            display: flex; align-items: center; justify-content: center;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .btn-primary:hover .btn-play {
            background: rgba(var(--primary-rgb), 0.2);
            box-shadow: 0 0 10px rgba(var(--primary-rgb), 0.15);
        }
        .btn-primary .btn-play svg {
            width: 12px; height: 12px; fill: var(--primary); margin-left: 1px;
        }

        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 18px 0; position: relative; z-index: 2;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        }
        .divider span {
            font-size: 0.58rem; color: rgba(255,255,255,0.2);
            text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600;
        }

        .toast-container {
            position: fixed; top: 16px; right: 16px;
            display: flex; flex-direction: column; gap: 8px; z-index: 1000;
        }

        .toast {
            min-width: 250px; padding: 12px 16px; border-radius: 14px;
            background: rgba(16, 14, 22, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--text); font-size: 0.8rem; font-weight: 600;
            display: flex; align-items: center; gap: 10px;
            transform: translateX(120%); opacity: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
            box-shadow: 0 16px 40px rgba(0,0,0,0.4);
        }

        .toast.show { transform: translateX(0); opacity: 1; }

        .toast.error {
            border-left: 3px solid var(--danger);
            box-shadow: 0 16px 40px rgba(0,0,0,0.4), 0 0 14px rgba(var(--danger-rgb), 0.08);
        }
        .toast.success {
            border-left: 3px solid var(--success);
            box-shadow: 0 16px 40px rgba(0,0,0,0.4), 0 0 14px rgba(var(--success-rgb), 0.08);
        }

        .toast-icon { width: 18px; height: 18px; flex-shrink: 0; }
        .toast.error .toast-icon { color: var(--danger); }
        .toast.success .toast-icon { color: var(--success); }

        .fade-1 { animation: fadeUp 0.5s ease forwards 0.1s; opacity: 0; }
        .fade-2 { animation: fadeUp 0.5s ease forwards 0.2s; opacity: 0; }
        .fade-3 { animation: fadeUp 0.5s ease forwards 0.3s; opacity: 0; }
        .fade-4 { animation: fadeUp 0.5s ease forwards 0.4s; opacity: 0; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="bg-canvas">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="grid-overlay"></div>
    <div class="noise" aria-hidden="true"></div>
    <div class="particles" id="particles"></div>

    <div class="wrap">
        <div class="card">
            <div class="card-glow"></div>

            <div class="brand fade-1">
                <div class="logo">
                    <img src="https://raw.githubusercontent.com/youssefhhh/NXWebsite/refs/heads/main/nn.ico"
                        width="46" height="46" alt="NX AIO" decoding="async" fetchpriority="high">
                </div>
                <div class="brand-text">
                    <h1>NX AIO</h1>
                    <p>Enter your license to continue</p>
                </div>
            </div>

            <label class="field-label fade-2" for="licenseKey">License key</label>
            <div class="input-wrap fade-2">
                <input type="text" id="licenseKey" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off"
                    spellcheck="false" autocapitalize="off">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    aria-hidden="true">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>

            <button type="button" class="btn-primary fade-3" id="loginBtn">
                <div class="btn-play">
                    <svg viewBox="0 0 24 24"><path d="M8 5V19L19 12L8 5Z"/></svg>
                </div>
                Sign in
            </button>

            <div class="divider fade-4">
                <span>Secure Login</span>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function () {
            var particlesEl = document.getElementById('particles');
            for (var i = 0; i < 14; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 14) + 's';
                p.style.animationDelay = Math.random() * 10 + 's';
                p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
                particlesEl.appendChild(p);
            }

            function showToast(message, type) {
                type = type || 'error';
                var container = document.getElementById('toastContainer');
                var toast = document.createElement('div');
                toast.className = 'toast ' + type;

                var iconSvg = type === 'success'
                    ? '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>'
                    : '<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';

                toast.innerHTML = iconSvg + '<span>' + message + '</span>';
                container.appendChild(toast);
                setTimeout(function () { toast.classList.add('show'); }, 10);
                setTimeout(function () {
                    toast.classList.remove('show');
                    setTimeout(function () { toast.remove(); }, 400);
                }, 3200);
            }

            document.getElementById('loginBtn').addEventListener('click', function (e) {
                var btn = this;
                var rect = btn.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                var ripple = document.createElement('span');
                ripple.style.cssText = 'left:' + x + 'px;top:' + y + 'px;position:absolute;transform:translate(-50%,-50%);width:0;height:0;border-radius:50%;background:rgba(var(--primary-rgb),.15);pointer-events:none;z-index:0;';
                if (!document.getElementById('ripple-css')) {
                    var st = document.createElement('style');
                    st.id = 'ripple-css';
                    st.textContent = '@keyframes ripple{0%{width:0;height:0;opacity:1}100%{width:350px;height:350px;opacity:0}}';
                    document.head.appendChild(st);
                }
                ripple.style.animation = 'ripple .5s ease-out';
                btn.appendChild(ripple);
                setTimeout(function () { ripple.remove(); }, 550);

                var key = document.getElementById('licenseKey').value.trim();

                if (!key) {
                    showToast('Please enter your license key', 'error');
                    return;
                }

                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage('LOGIN|' + key);
                } else {
                    window.location.href = 'index.html';
                }
            });

            document.getElementById('licenseKey').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') document.getElementById('loginBtn').click();
            });

            window.showLoginError = function (msg) {
                showToast(msg || 'Invalid license key', 'error');
            };
            window.showLoginSuccess = function (msg) {
                showToast(msg || 'Login successful', 'success');
            };
        })();
    </script>
</body>

</html>
